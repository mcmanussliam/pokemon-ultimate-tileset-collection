name: Download artwork previews

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum unresolved sources to check
        required: true
        default: '711'
        type: number

permissions:
  contents: write

concurrency:
  group: tileset-gallery
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Download accessible source artwork
        env:
          PREVIEW_LIMIT: ${{ inputs.limit }}
        run: npm run previews -- --limit="$PREVIEW_LIMIT"
      - run: npm test
      - name: Commit previews and source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _catalog/previews.json _catalog/preview-report.json site/public/previews
          if ! git diff --cached --quiet; then
            git commit -m "Download local artwork previews"
            git push
          fi
