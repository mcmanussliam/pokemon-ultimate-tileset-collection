name: Sync collection and deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tileset-gallery
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Refresh tilesets, folders and READMEs from original sheet
        run: npm run sync

      - name: Generate small local previews from accessible artwork
        run: npm run thumbnails -- --limit=250
        continue-on-error: true

      - name: Commit refreshed metadata, folders, and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The catalogue is already up to date."
          else
            git commit -m "Sync catalogue and local thumbnails from original sheet"
            git push
          fi

      - name: Build the TypeScript gallery
        run: npm run build

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Note when Pages needs enabling
        if: steps.pages.outcome != 'success'
        run: echo "::warning::Enable Pages under Settings → Pages → Source GitHub Actions, then rerun this workflow."

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
