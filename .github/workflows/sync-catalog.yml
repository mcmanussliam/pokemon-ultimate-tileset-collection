name: Sync tileset index from original spreadsheet

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import_sheet.py"
      - ".github/workflows/sync-catalog.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import the public Google Sheet
        run: python3 scripts/import_sheet.py --output .

      - name: Commit updated category and item READMEs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Spreadsheet index is already up to date."
          else
            git commit -m "Sync tileset metadata and credits from source spreadsheet"
            git push
          fi
