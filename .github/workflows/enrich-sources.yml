name: Enrich source descriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 1 * *"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Inspect public source descriptions
        run: npm run enrich -- --limit=120
      - name: Commit source descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _catalog/enrichment.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh source descriptions"
            git push
          fi
